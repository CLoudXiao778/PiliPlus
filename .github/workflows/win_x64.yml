name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Patch media_kit_video D3D11 renderer
        shell: pwsh
        run: |
          git clone --depth=1 -b native https://github.com/bggRGjQaUbCoE/media-kit.git media-kit
          git -C media-kit fetch --depth=1 origin 85f0a69ea66b100882b27a3375c72e5155375343
          git -C media-kit checkout --detach 85f0a69ea66b100882b27a3375c72e5155375343
          git -C media-kit apply "$env:GITHUB_WORKSPACE/patches/media_kit_video_windows_d3d11.patch"
          @'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(
              r'(?m)^  media_kit_video:\n(?:    [^\n]*\n)+',
              '  media_kit_video:\n    path: media-kit/media_kit_video\n',
              s,
          )
          assert '\nflutter:\n  uses-material-design: true' in s2, 'pubspec flutter section lost'
          open(p, 'w', encoding='utf-8').write(s2)
          '@ | python -
          flutter pub get

      - name: Prepare updated libmpv for installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z" -OutFile libmpv.7z
          7z x libmpv.7z -olibmpv -y
          New-Item -ItemType Directory -Force C:\libmpv | Out-Null
          Copy-Item libmpv/libmpv-2.dll C:\libmpv\libmpv-2.dll -Force
          # Pre-extract the same libmpv into the CMake build directory so the
          # D3D11 video backend compiles against the matching render.h and links
          # the matching import library. media_kit_libs_windows_video will see a
          # non-empty libmpv directory and skip its own extraction.
          $libmpvSrc = "build/windows/x64/libmpv"
          New-Item -ItemType Directory -Force $libmpvSrc | Out-Null
          7z x libmpv.7z "-o$libmpvSrc" -y
          if (Test-Path "$libmpvSrc/include/mpv") {
            Move-Item "$libmpvSrc/include/mpv/*" "$libmpvSrc/include/" -Force
            Remove-Item "$libmpvSrc/include/mpv" -Recurse -Force
          }

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,dart-define=PLAYER_DIAGNOSTICS=true,dart-define=MEDIA_KIT_D3D11=true,no-pub" --skip-clean

      - name: Verify bundled assets
        shell: pwsh
        run: |
          $root = "build/windows/x64/runner/Release/data/flutter_assets"
          Write-Host "== flutter_assets directories =="
          Get-ChildItem $root -Directory | Select-Object -ExpandProperty Name
          Write-Host "== fonts/ =="
          Get-ChildItem "$root/fonts" -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length
          Write-Host "== assets/fonts/ =="
          Get-ChildItem "$root/assets/fonts" -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length
          Write-Host "== FontManifest.json =="
          Get-Content "$root/FontManifest.json"
          $required = @(
            "$root/fonts/MaterialIcons-Regular.otf",
            "$root/assets/fonts/custom_icon.ttf",
            "$root/assets/fonts/digital_id_num.ttf"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Host "::warning::Missing bundled font: $file"
            }
          }

      - name: Prepare Upload
        run: |
          mkdir -p Release/PiliPlus-Win
          mkdir -p PiliPlus-Win-Setup
          mv build/windows/x64/runner/Release/* Release/PiliPlus-Win/
          mv dist/**/*.exe PiliPlus-Win-Setup/PiliPlus_windows_${{env.version}}_x64_setup.exe

      - name: Use updated libmpv (d3d11egl / d3d11 render API)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z" -OutFile libmpv.7z
          7z x libmpv.7z -olibmpv -y
          Copy-Item libmpv/libmpv-2.dll Release/PiliPlus-Win/libmpv-2.dll -Force

      - name: Compress
        run: |
          Compress-Archive -Path "Release/PiliPlus-Win" -DestinationPath "PiliPlus_windows_${{env.version}}_x64_portable.zip"
        shell: pwsh

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_windows_*.zip
            PiliPlus-Win-Setup/PiliPlus_windows_*.exe

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: PiliPlus_windows_*.zip

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-release
          path: PiliPlus-Win-Setup/PiliPlus_windows_*.exe
